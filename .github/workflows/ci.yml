name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Verify the console script works end to end
        shell: bash
        run: |
          set +e
          llm-eval-gate tests/fixtures/baseline.json tests/fixtures/candidate_ok.json --quiet
          ok=$?
          llm-eval-gate tests/fixtures/baseline.json tests/fixtures/candidate_regressed.json --quiet
          bad=$?
          set -e
          echo "pass-case exit=$ok (want 0); regression-case exit=$bad (want 1)"
          test "$ok" -eq 0
          test "$bad" -eq 1

      - name: Check the gate reports a regression as JSON
        run: |
          llm-eval-gate tests/fixtures/baseline.json tests/fixtures/candidate_regressed.json \
            --format json --quiet --output gate.json || true
          python -c "import json;d=json.load(open('gate.json'));assert d['summary']['regressions']==2,d['summary'];print('ok')"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile every module
        run: python -m compileall -q src tests
      - name: Check the TOML example still parses
        run: |
          python - <<'PY'
          import tomllib, pathlib
          for path in pathlib.Path('.').glob('*.toml'):
              with path.open('rb') as fh:
                  tomllib.load(fh)
              print('parsed', path)
          PY

  self-gate:
    name: self-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --disable-pip-version-check -e .
      - name: Run the action against its own fixtures
        uses: ./
        with:
          baseline: tests/fixtures/baseline.json
          candidate: tests/fixtures/candidate_ok.json
          format: github
