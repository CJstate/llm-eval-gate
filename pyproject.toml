[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "EvalGuard"
version = "0.1.0"
description = "Catch LLM evaluation regressions in CI with a stderr-aware noise band"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "CJstate" }]
keywords = [
    "llm",
    "evaluation",
    "benchmark",
    "regression-testing",
    "ci",
    "lm-evaluation-harness",
    "evals",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/CJstate/EvalGuard"
Issues = "https://github.com/CJstate/EvalGuard/issues"

[project.scripts]
evalguard = "llm_eval_gate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_eval_gate", "src/evalguard"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "demo", "README.md", "LICENSE", "action.yml", "gate.example.toml"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
